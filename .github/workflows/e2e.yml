name: E2E

# Manual trigger while the suite stabilizes against a live stack. Once it's
# confirmed green from a run here, add `pull_request:` / `push:` (as in ci.yml)
# to gate every change on it. Kept out of ci.yml on purpose: this job builds and
# boots the whole Docker stack, so it is far heavier than the unit jobs.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-erp-react/package-lock.json

      - name: Bring up the stack
        env:
          # Known admin password so the tests can log in deterministically.
          ADMIN_PASSWORD: e2e-admin-pass
        run: docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health/ready; then
              echo "ready"; exit 0
            fi
            sleep 5
          done
          echo "API did not become ready in time"; exit 1

      - name: Install frontend deps
        working-directory: frontend-erp-react
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend-erp-react
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend-erp-react
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: e2e-admin-pass
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-erp-react/playwright-report/
          retention-days: 7

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f docker-compose.local.yml down -v
